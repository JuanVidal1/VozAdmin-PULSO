name: VozAdmin CI

concurrency:
  group: vozadmin-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Lint source code
        run: npm run lint
      - name: Audit dependencies
        run: npm audit
      - name: Build application
        run: npm run build
